<body>

<header>
    <nav>
        <ul class="navbar">
            <li><a href="index.html">Home</a></li>
            <li><a href="restaurants.html">Restaurants</a></li>

            <li><a href="reservation.html">Reservation</a></li>
            <li><a href="bill.html">Bill Calculator</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="register-section">
        <h1>Create Your Account</h1>
        <p>Please fill in the form below to register.</p>

        <form id="registerForm" method="post" action="http://mercury.swin.edu.au/it000000/cos10005/formtest2.php">

            <!-- Username -->
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Minimum 5 characters" required>

            <!-- Email -->
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>

            <!-- Phone -->
            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone" placeholder="Digits only" required>

            <!-- Password -->
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   placeholder="At least 10 characters" required>

            <!-- Confirm Password -->
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>

            <!-- Gender -->
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">-- Select --</option>
                <option value="M">Male</option>
                <option value="F">Female</option>
                <option value="O">Other</option>
            </select>

            <!-- Dietary Preference -->
            <label for="diet">Dietary Preference:</label>
            <select id="diet" name="diet" required>
                <option value="">-- Select --</option>
                <option value="none">None</option>
                <option value="vegan">Vegan</option>
                <option value="halal">Halal</option>
            </select>

            <!-- Country / Region -->
            <label for="country">Country / Region:</label>
            <select id="country" name="country" required>
                <option value="">-- Select --</option>
                <option value="Australia">Australia</option>
                <option value="New Zealand">New Zealand</option>
                <option value="India">India</option>
                <option value="China">China</option>
                <option value="Malaysia">Malaysia</option>
                <option value="Other">Other</option>
            </select>

            <!-- Submit -->
            <button type="submit" id="submitBtn">Register</button>

            <!-- Error Display -->
            <div id="errorMessages"></div>

        </form>
    </section>

</main>

<footer>
    <p>&copy; 2026 Restaurant Discovery Platform</p>
</footer>

</body>
</html>
